<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
<title>پنل مدیریت</title>
<link rel="icon" href="/images/mark.png">
<meta name="theme-color" content="#0f0f23">
<link rel="stylesheet" href="/panel/panel.css">
</head>
<body>
<noscript><p style="padding:2rem">برای استفاده از پنل، جاوااسکریپت مرورگر باید فعال باشد.</p></noscript>

<section id="login" class="login" hidden>
  <form id="login-form" class="card" autocomplete="on">
    <img src="/images/logo.png" alt="" width="64" height="64" data-cms-logo>
    <h1>ورود به پنل مدیریت</h1>
    <label for="lu">نام کاربری</label>
    <input id="lu" name="username" autocomplete="username" required dir="ltr">
    <label for="lp">رمز عبور</label>
    <input id="lp" name="password" type="password" autocomplete="current-password" required dir="ltr">
    <p id="login-msg" class="msg" role="alert"></p>
    <button class="btn" type="submit">ورود</button>
  </form>
</section>

<div id="app" hidden>
  <div id="overlay" class="sidebar-overlay"></div>
  <aside id="sidebar" class="app-sidebar" aria-label="منوی پنل">
    <div class="brand">
      <span class="brand-mark"><img src="/images/mark.png" alt="" width="36" height="36"></span>
      <div><strong>پنل مدیریت</strong><small>پایان‌نامه پلاس</small></div>
      <button id="menu-close" class="menu-close" type="button" aria-label="بستن منو">×</button>
    </div>
    <nav id="nav" class="sidebar-nav" aria-label="بخش‌ها"></nav>
    <div class="sidebar-profile">
      <span class="avatar" id="me-avatar" aria-hidden="true"></span>
      <div><strong id="me-name"></strong><small id="me-title">مدیر سایت</small></div>
      <span class="profile-status" title="متصل"></span>
    </div>
  </aside>

  <div class="app-main">
    <header class="app-header">
      <button id="menu-btn" class="menu-button" type="button" aria-label="باز و بسته کردن منو" aria-expanded="false" aria-controls="sidebar"></button>
      <div class="page-title"><h1 id="page-title">پنل مدیریت</h1><p id="page-sub"></p></div>
      <div class="header-actions">
        <button id="back-btn" class="btn btn-secondary btn-sm" type="button" hidden aria-label="بازگشت به صفحه‌ی قبل"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg><span>بازگشت</span></button>
        <a class="btn btn-secondary btn-sm" href="/" target="_blank" rel="noopener" id="view-site">مشاهده سایت</a>
        <button id="logout" class="btn btn-secondary btn-sm" type="button">خروج</button>
      </div>
    </header>

    <main class="page-content">
      <div id="langbar" class="langbar" role="tablist" aria-label="زبان">
        <button type="button" role="tab" data-lang="fa" aria-selected="true">فارسی</button>
        <button type="button" role="tab" data-lang="en" aria-selected="false">English</button>
      </div>
      <p id="lang-note" class="muted"></p>
      <div id="content"></div>
    </main>
  </div>

  <div id="savebar" class="savebar" hidden>
    <span id="savecount"></span>
    <button id="discard" class="btn btn-secondary" type="button">لغو تغییرات</button>
    <button id="save" class="btn btn-primary" type="button">ذخیره</button>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script src="/panel/panel.js"></script>
</body>
</html>
